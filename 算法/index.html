<body>
    <script>
        var twoSum = function (nums, target) {
            let sumObj = {}
            const len = nums.length
            for (let i = 0; i < len; i++) {
                if (typeof sumObj[target - nums[i]] === "number") {
                    console.log([i, sumObj[target - nums[i]]])
                    return [i, sumObj[target - nums[i]]]
                }
                sumObj[nums[i]] = i
            }
        };
        twoSum([2, 7, 11, 15], 9)
    </script>
</body>
