        // 非立即执行，适用于输入框
        const debounce = (cb, delay) =>{
            let timer = null
            return () => {
                if(timer){
                    clearTimeout(timer)
                }
                timer = setTimeout(()=>{
                    cb()
                },delay)

            }
        }
        btn.onclick = debounce(()=>{
            console.log("111111")
        }, 1000)



    </script>
